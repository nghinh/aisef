[build-system]
# pinned exactly (V2.0 charter G2): the RC's frozen wheel/sdist digests must be rebuildable, and a newer backend
# writes different metadata
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aisef"             # gói, module và lệnh cùng một tên từ 0.2.0
# The ONE place the version lives (aisef.__version__ reads the installed metadata). It becomes 2.0.0 only at the
# V2.0-RC1 freeze (docs/v2/V2-STABLE-RELEASE-CHARTER.md §10/§11); a stable `vX.Y.Z` tag must equal it or
# .github/workflows/release.yml refuses to publish.
version = "1.7.6"
description = "AISEF — AI Software Engineering Framework: input is docs/requirements.md, output is gate-verified code with SHA-bound evidence"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []          # toàn bộ khung chạy bằng thư viện chuẩn

[project.urls]
Homepage = "https://aisef.io/"
Repository = "https://github.com/nghinh/aisef"

[project.scripts]
aisef = "aisef.cli:main"

[tool.setuptools.packages.find]
# The distribution ships exactly V1 (`aisef`) and the V2 runtime (`aisef2`, every subpackage: charter G1 makes V2
# the authoritative `aisef run`) — never tests/, validation/ or closure-evidence/. Guarded by
# validation/v2/packaging_check.py: `--check` on this table (a calibrated Q0 checker), `--artifacts dist` on the
# built wheel and sdist (the wheel job of .github/workflows/tests.yml and the staging workflow).
include = ["aisef", "aisef.*", "aisef2", "aisef2.*"]

[tool.setuptools.package-data]
# Prompt, luật, skill và script trình duyệt là *dữ liệu chạy*, không phải tài
# liệu: thiếu chúng thì `aisef run` chết ở lần gọi agent đầu tiên.
"aisef" = ["kit/prompts/*", "kit/rules/*", "kit/skills/**/*", "kit/*.json", "harness/assets/*"]

[tool.ruff]
target-version = "py311"        # bản thấp nhất khai hỗ trợ, không phải bản của máy đo
line-length = 120

[tool.ruff.lint]
# Tập rule là **cổng**, không phải sở thích: chỉ những lớp lỗi mà một phát hiện
# là một lỗi thật hoặc một mập mờ thật. Bật 2026-09-12 sau khi đo: F/B/E9 sạch
# sau ~90 sửa nhỏ, và chính lượt bật đã bắt một lỗi vừa gây ra (đổi tên biến
# vòng lặp còn dùng trong thân) — đó là giá trị của cổng.
#   F  pyflakes     — import thừa, biến gán không dùng, tên không tồn tại
#   B  bugbear      — zip() không khai strict, raise mất nguyên nhân, biến vòng lặp chết
#   E9 pycodestyle  — lỗi cú pháp/IO ở mức chặn
select = ["F", "B", "E9"]
# Hoãn có lý do (đo 2026-09-12) — không phải "bỏ qua vì ồn":
#   I001/UP/ISC/SIM/PERF/C4 — thuần phong cách, sửa hàng loạt sát phát hành là churn
#     không đổi hành vi; mở sau khi 1.3.0 ra, từng họ một.
#   PLW1510 (66 chỗ) — `subprocess.run` không khai `check=`: harness **cố ý** đọc
#     returncode; khai `check=False` tường minh là đúng nhưng chạm 66 điểm gọi.
#   S (bandit) — phần lớn là subprocess/tempfile mà harness buộc phải dùng; cần
#     một lượt phân loại riêng trước khi thành cổng.

[tool.ruff.lint.per-file-ignores]
# Fixture và kho task của bench là **byte đã ghim** (MANIFEST.sha256) — sửa lint
# ở đó làm hỏng dataset.
"tests/bench/tasks/**" = ["ALL"]
"tests/fixtures/**" = ["ALL"]

[tool.pytest.ini_options]
testpaths = ["tests"]
