[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aisef"             # gói, module và lệnh cùng một tên từ 0.2.0
version = "0.2.0"
description = "AISEF — AI Software Engineering Framework: đầu vào là docs/requirements.md, đầu ra là code đã qua cổng kiểm"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []          # toàn bộ khung chạy bằng thư viện chuẩn

[project.scripts]
aisef = "aisef.cli:main"
# Bí danh **tạm** của 0.1.0: hook đã biên dịch trong dự án cũ gọi `aisdlc …`,
# gãy đột ngột thì người dùng không biết vì sao. Nó cảnh báo rồi chạy tiếp, và
# sẽ bị gỡ ở 0.3.0.
aisdlc = "aisef.cli:main_deprecated_alias"

[tool.setuptools.packages.find]
include = ["aisef*"]

[tool.setuptools.package-data]
# Prompt, luật, skill và script trình duyệt là *dữ liệu chạy*, không phải tài
# liệu: thiếu chúng thì `aisef run` chết ở lần gọi agent đầu tiên.
"aisef" = ["kit/prompts/*", "kit/rules/*", "kit/skills/**/*", "kit/*.json", "harness/assets/*"]
