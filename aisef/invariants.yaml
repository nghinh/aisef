# AISEF invariant registry — systematic hardening v1, Phase 1.
# Read by aisef/control/invariants.py (a small YAML subset: two-space indent, `key: value`, `- item`).
# docs/INVARIANTS.md is rendered from this file; tests/hardening/test_invariants_registry.py checks that
# every referenced test exists and that the rendered document is in sync.
# Status: PROVEN = enforced and covered by deterministic tests with no known open sibling;
#         PARTIAL = enforced somewhere, with a confirmed gap (RED reproducer named);
#         MISSING = the kernel does not enforce it yet.
program: AISEF SYSTEMATIC HARDENING PROGRAM v1
baseline: aisef==1.7.6 (tag v1.7.6 = 939f2ab)
invariants:
  - invariant_id: INV-A.1
    domain: candidate identity
    statement: A frozen candidate is immutable. Verification, review and security sessions never mutate it; a mutation is reverted, recorded, and that session does not count.
    why: Every check must describe one exact tree; a reviewer that edits code is a second developer whose work nobody graded (bug 3, D-032).
    severity_if_violated: P1
    enforcement_points:
      - aisef/phases/implement.py::freeze_candidate
      - aisef/phases/implement.py::_revert_reviewer_writes
      - aisef/phases/implement.py::_candidate_moved
    deterministic_tests:
      - tests/test_candidate.py::TestReviewerDoiUngVien
      - tests/test_implement.py::TestNguoiRaSoatKhongDuocSuaCay
      - tests/test_run2_review_recovery.py
      - tests/hardening/test_sibling_scan.py::TestSS36ToolArtifactsAreNotReviewerWrites
    model_tests:
      - tests/hardening/test_state_model.py::TestKernelModel::test_property_8_verification_never_mutates_the_candidate
    fault_injection_tests:
      - tests/hardening/test_fault_matrix.py::TestReviewFaults
    linked_defects:
      - D-032
      - SS-36
    status: PROVEN
  - invariant_id: INV-A.2
    domain: candidate identity
    statement: Evidence satisfies a gate only when it is bound to the exact candidate being scored; evidence of another build is stated as stale and never scores.
    why: ADR-004 R1 — "which code did this test run on" must have one answer.
    severity_if_violated: P0
    enforcement_points:
      - aisef/control/gate.py::_stale_candidates
      - aisef/harness/observe.py::Evidence.for_candidate
      - aisef/control/identity.py::fresh
      - aisef/harness/observe.py::Evidence.for_identity
      - aisef/control/gate.py::_stale_for
      - aisef/phases/implement.py::run_attempt (no candidate → typed UNRUNNABLE, nothing graded)
    deterministic_tests:
      - tests/test_candidate.py::TestGateCandidate
      - tests/test_gate_qualification.py::TestBangChungDungCandidate
      - tests/test_preservation.py::TestCongBaoToan
      - tests/hardening/test_sibling_scan.py::TestSS02GuardHeartbeatIsBoundToTheGradedSession
      - tests/hardening/test_sibling_scan.py::TestSS03CriteriaProofBindsToTheCandidate
      - tests/hardening/test_sibling_scan.py::TestSS02GuardHeartbeatIsBoundToTheGradedSession
      - tests/hardening/test_sibling_scan.py::TestSS03CriteriaProofBindsToTheCandidate
      - tests/hardening/scan8a/test_group_b.py::TestSS15RefusedFreezeIsNotGradedUnderTheParent
      - tests/hardening/scan8a/test_group_e.py::TestSS60ADoneStoryHasAFrozenCandidate
    model_tests:
      - tests/hardening/test_state_model.py::TestKernelModel::test_property_3_no_pass_on_foreign_evidence
    fault_injection_tests:
      - tests/hardening/test_fault_matrix.py::TestEvidenceFaults
    linked_defects:
      - SS-02
      - SS-03
    status: PROVEN
  - invariant_id: INV-A.3
    domain: candidate identity
    statement: The candidate that merges is the candidate that was verified, on a tree clean of story changes; harness-owned and tool-written paths are not story changes.
    why: G12 — done is written only after merge.completed; a dirty check that counts the harness's own files refuses a passed candidate for the wrong reason.
    severity_if_violated: P1
    enforcement_points:
