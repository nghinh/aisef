    linked_defects:
      - SS-17
      - SS-16
    status: PROVEN
  - invariant_id: INV-B.1
    domain: story epoch
    statement: A story contract has an explicit epoch, the fingerprint of its acceptance criteria, recorded as the story:contract note.
    why: Without an identity for "which criteria", a verdict, a baseline or a test can silently refer to a different story (D-004, D-033).
    severity_if_violated: P1
    enforcement_points:
      - aisef/control/acceptance.py::contract_fingerprint
      - aisef/phases/run.py (story:contract note)
    deterministic_tests:
