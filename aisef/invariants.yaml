    statement: A baseline that could not be captured (tool unrunnable) is recaptured at the known root once the tool is available; it does not block the story forever.
    why: The root SHA is recorded; a transient environment failure must not become a permanent BASELINE_UNAVAILABLE.
    severity_if_violated: P2
