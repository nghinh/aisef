    statement: A contract change creates a new epoch — the branch is dropped, the baseline is recaptured at the integrated parent, and evidence of the old epoch never scores the new one.
    why: A verdict about other criteria is not about this story (bug 143, D-033).
    severity_if_violated: P1
    enforcement_points:
      - aisef/phases/run.py::_drop_branch_written_for_other_criteria
      - aisef/control/gate.py::authoritative_baseline
    deterministic_tests:
