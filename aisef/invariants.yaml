    domain: evidence provenance
    statement: Evidence may satisfy a gate only when every identity the decision depends on matches — run, story, story epoch, candidate, baseline root, stage, verifier configuration, environment.
    why: A record stamped with the right candidate but computed under another tool configuration or another epoch is not about the decision being made.
