  - invariant_id: INV-T.EXECUTED-EVIDENCE
    domain: pass safety
    statement: A test is green only when a run executed it and it passed. Skipped, errored, not-collected or absent tests never count as still green, never as not regressed and never keep a behaviour verified; a baseline that executed nothing proves "nothing to regress" only where the tree holds no test at all.
