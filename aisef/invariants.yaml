    status: PROVEN
  - invariant_id: INV-C.2
    domain: baseline identity
    statement: Candidate state never becomes its own baseline; absent or provenance-invalid baseline fails closed as BASELINE_UNAVAILABLE.
    why: A baseline the story wrote proves nothing about what existed before it.
    severity_if_violated: P1
    enforcement_points:
