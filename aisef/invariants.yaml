  - invariant_id: INV-TDD-NOP-PROOF
    domain: pass safety
    statement: "'Tests verify story' and TDD pass only on positive, criterion-specific evidence that the story's tests do not pass at the story-entry parent — each test RED_EXECUTED, or RED_COLLECTION_BOUND_TO_STORY because the test's own file cannot import a module the story adds or a symbol the story's diff to that module supplies. Absence of execution is never proof: NOT_COLLECTED, COLLECTION_ABORTED, DEPENDENCY_UNRUNNABLE, ENVIRONMENT_UNRUNNABLE, MALFORMED_EVIDENCE, SKIPPED and ABSENT never equal red, one file's collection failure never hides another file's tests, and package matching alone never binds a failure to the story."
    why: SS-81 — the control scored tests that never ran at the parent as red (a missing third-party package; a pytest session stopped at the first collection error while a tautological criterion test sat in another file), and TDD deferred to it; W0 at 02a34e0e was voided for it (2026-09-18).
