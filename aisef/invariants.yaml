    status: PROVEN
  - invariant_id: INV-C.1
    domain: baseline identity
    statement: The regression baseline is captured once per story epoch at the integrated parent, carries root and epoch, and is reused by retries, resumes and verify-only.
    why: D-033 — a baseline recorded at the story's own candidate turned renaming its own tests into a regression.
    severity_if_violated: P1
    enforcement_points:
