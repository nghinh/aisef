# Phát hành lên PyPI khi đẩy tag `v*` — dùng *trusted publishing* (OIDC),
# không có token nào nằm trong kho hay trong secrets. Quyết định 2026-09-05:
# tên gói `aisef` (module/lệnh vẫn `aisef`), tài khoản tổ chức; publish khi hoàn tất đợt 4.
#
# Việc phải làm một lần bằng tay (không tự động hoá được): trên PyPI, tài
# khoản tổ chức tạo project `aisef` và thêm "trusted publisher" trỏ tới
# kho này (`nghinh/aisef`), workflow `release.yml`, environment `pypi`. Sau đó
# `git tag vX.Y.Z && git push origin vX.Y.Z` là đủ.
#
# Đổi tên kho **là** đổi publisher: PyPI khớp theo đúng chuỗi `chủ/tên kho` lấy
# từ token OIDC, nên sau lần đổi tên 2026-09-06 (`ai-sdlc` → `aisef`) phải khai
# lại, không thì job `publish` bị từ chối dù mọi thứ khác xanh.
name: release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 — bộ test có phép **cố ý** dựng lại một commit gốc
      # trong lịch sử chính kho này (`git archive <task.base>`, bench A-2).
      # Checkout mặc định là shallow (depth 1), nên commit ấy không tồn tại và
      # phép thử **lỗi** chứ không bỏ qua. Đo được: đợt phát hành v1.7.0
      # (run 34908370558) đỏ với 4 lỗi `git archive … exit 128`, trong khi cùng
      # commit ấy xanh 3056/0 ở máy có lịch sử đầy đủ. Không sửa phép thử: nó
      # đúng, môi trường thiếu.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Kiểm phát hành (unit + bảng hợp quy còn mới)
        run: |
          python -m unittest discover -s tests -q
          # `-v`, không `-q`: `-q` in "OK (skipped=1)" — người đọc log phát hành
          # thấy xanh mà không thấy **phép nào** bị bỏ. Phép nghiệm thu dogfood
          # bỏ qua khi thiếu `AISEF_ACCEPTANCE`; `-v` in tên nó kèm lý do.
          AISEF_RELEASE=1 python -m unittest tests.test_release_gate -v
      - name: Build
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # OIDC cho trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
