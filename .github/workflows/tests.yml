# Bộ test unit của framework — chạy mỗi push/PR. Không cần bí mật, không cần client.
name: tests
on:
  push:
    branches: [main, master]
  pull_request:
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test (chỉ thư viện chuẩn)
        run: python3 -m unittest discover -s tests -q
