name: tests
on:
  push:
    branches: [master, "release/**"]
  pull_request:
  # release.yml runs this whole workflow, on the tagged commit, as a gate before any production publish
  workflow_call:
jobs:
  unit:
    # Windows is a declared target and had never executed a single test: bugs
    # 33, 34, 45 and 46 all reached users because CI ran only Linux. One
    # Windows runner on the lowest supported Python is enough to catch that
    # class — the OS is the variable, not the interpreter version.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python-version: "3.11"
          # V2.0 charter G4: `aisef run` is claimed on Linux and macOS (docs/v2/USAGE.md), so the exact RC is tested
          # on a macOS runner too — a claimed platform is a CI-green platform
          - os: macos-latest
            python-version: "3.12"
    steps:
      # fetch-depth: 0 — bộ test có phép **cố ý** dựng lại một commit gốc
      # trong lịch sử chính kho này (`git archive <task.base>`, bench A-2).
      # Checkout mặc định là shallow (depth 1), nên commit ấy không tồn tại và
      # phép thử **lỗi** chứ không bỏ qua. Đo được: đợt phát hành v1.7.0
      # (run 34908370558) đỏ với 4 lỗi `git archive … exit 128`, trong khi cùng
      # commit ấy xanh 3056/0 ở máy có lịch sử đầy đủ. Không sửa phép thử: nó
      # đúng, môi trường thiếu.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # WP-4.2 / process-leak discipline: the suite runs inside an OS-owned process range; the job fails when an owned
      # process outlives it (or escapes it), even if every test passed. Measured, never grepped.
      - run: python -P validation/v2/owned_run.py -- python -m unittest discover -s tests -q
      # WP-0.4 — V1 closure evidence is frozen. The suite arms an in-process guard at discovery; this step is
      # the detective layer and runs AFTER the suite, on every OS, so a test that rewrote V1 evidence by any
      # route (including a subprocess) fails the build. Compares git objects, so Windows autocrlf is safe.
      - run: python -P validation/v2/v1_evidence_guard.py --check

  # Cổng lint — bật 2026-09-12. Tập rule ở `[tool.ruff.lint]` của pyproject là
  # cổng chứ không phải sở thích: F (pyflakes), B (bugbear), E9. Lượt bật đã bắt
  # một lỗi thật ngay trong chính lượt ấy, nên phép này có giá trị chứng minh
  # được, không phải nghi thức.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff==0.16.4
      - run: ruff check .

  # Wheel smoke — lỗi 31 là lớp lỗi mà unit test **không thể** bắt: bản cài từ
  # wheel biên dịch hook trỏ vào đường dẫn không tồn tại, cú pháp hợp lệ, và
  # không guard nào chạy. Phép này cài gói như người dùng cài rồi hỏi ba câu:
  # lệnh có chạy không, dữ liệu chạy (prompt/luật/skill/asset) có trong gói
  # không, và gói có dựng nổi một dự án trống không.
  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install build twine
      - name: build reproducibly (SOURCE_DATE_EPOCH = the commit's time; the sdist re-packed deterministically)
        run: |
          set -eu
          export SOURCE_DATE_EPOCH="$(python -P validation/qualification/release_rc.py --epoch)"   # the frozen RC's once frozen
          python -m build
          python -P validation/qualification/repro_dist.py dist/*.tar.gz
          sha256sum dist/*
      - run: twine check dist/*
      # V2 charter G1/§9: the distribution ships exactly V1 (`aisef`) and the V2 runtime (`aisef2`, every
      # subpackage) — never tests/, validation/ or closure-evidence/. `python -m build` builds this wheel FROM the
      # sdist, so this is also the rebuilt-from-sdist case.
      - name: the wheel and the sdist hold exactly aisef + aisef2
        run: python -P validation/v2/packaging_check.py --artifacts dist
      - name: install the wheel into a clean venv
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install --no-index --no-deps dist/*.whl
      # tests/installed_smoke.py, run isolated (-I) by the venv's interpreter: aisef and aisef2 import from the
      # installed wheel, `aisef --version` reports pyproject's version, the runtime data (prompts, rules, skills,
      # assets, catalog) is packaged.
      - name: clean-install smoke — the command, its version, aisef2, the packaged runtime data
        run: |
          set -eu
          want=$(python -c "import tomllib,pathlib;print(tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version'])")
          /tmp/venv/bin/aisef --version
          (cd /tmp && /tmp/venv/bin/python -I -c "import aisef2")
          /tmp/venv/bin/python -I tests/installed_smoke.py "$want"
      - name: a clean project can be initialised by the installed command
        run: |
          set -eu
          mkdir -p /tmp/proj && cd /tmp/proj && git init -q .
          /tmp/venv/bin/aisef init --stack python
          test -f .ai/config.json
