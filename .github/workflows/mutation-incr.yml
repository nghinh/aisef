# CI-INCR-JOB (docs/v2.3/W1-DESIGN.md §7; DEPENDENCY-DAG `F5 -> CI-INCR-JOB`): incremental qualification on every push,
# under the owner-approved TWO-TIER policy (ruling 2026-11-22 §4; docs/v2.3/amendments/CI-TWO-TIER.md — it supersedes
# W1-DESIGN §11 exit gate 2's always-fail for DEVELOPMENT pushes; the rc tier keeps that strict gate).
# validation/v23/ci_gate.py wraps the F5 engine (validation/v23/impact.py): each live mutation target's evidence state
# on the pushed commit — MEASURED / VERIFIED_REUSE / INVALIDATED / UNRESOLVED, with the rule that decided it — plus the
# pinned in-process negative controls. ENGINE ONLY: it reads git and the tree and executes no mutant, no kill test and
# no mutation campaign.
#
# `gate` (release/** pushes, PRs) = the DEVELOPMENT tier: reports every INVALIDATED and UNRESOLVED state truthfully
# (final line `EVIDENCE: INCOMPLETE (NOT QUALIFIED)` while any target lacks evidence; incomplete evidence is never
# relabelled) and fails only on genuine checker malfunction, false-current reuse or negative-control regression.
# `rc` (release tags, or a dispatch with tier=rc) = the FROZEN-RC / PRODUCTION qualification tier: additionally fails
# whenever ANY target lacks valid MEASURED or VERIFIED_REUSE evidence. Neither tier takes an exception list.
# `plan` (dispatch, tier != rc) lists the INVALIDATED and UNRESOLVED targets with their reasons.
#
# The b1-linux.yml pattern: no opencode on the runner (refused if present), XDG dirs in runner scratch, a read-only
# token, no secret, and the full history — a shallow clone has no basis commit, so every target is UNRESOLVED (N10).
# Never runs b1_bindings_check.
name: mutation-incr

on:
  push:
    branches: ["release/**"]
    tags: ["v[0-9]*.[0-9]*.[0-9]*"]
  pull_request:
  workflow_dispatch:
    inputs:
      tier:
        description: "rc: run the frozen-RC qualification tier; anything else lists the affected targets (plan)"
        required: false
        default: "plan"

permissions:
  contents: read

jobs:
  gate:
    if: github.event_name != 'workflow_dispatch' && github.ref_type != 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: development tier — truthful F5 state table + negative controls; fails only on §4 (a)-(c)
        env:  # step level: the runner context is not available in a job-level env
          XDG_DATA_HOME: ${{ runner.temp }}/xdg/data
          XDG_STATE_HOME: ${{ runner.temp }}/xdg/state
          XDG_CACHE_HOME: ${{ runner.temp }}/xdg/cache
        run: |
          if command -v opencode; then echo "OPENCODE PRESENT — refusing"; exit 1; fi
          echo "opencode ABSENT (guard OK)"
          mkdir -p "$XDG_DATA_HOME" "$XDG_STATE_HOME" "$XDG_CACHE_HOME"
          git rev-parse HEAD
          python -P validation/v23/ci_gate.py --tier develop

  rc:
    if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.tier == 'rc')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: frozen-RC tier — develop tier plus FAIL while any target lacks MEASURED or VERIFIED_REUSE evidence
        env:  # step level: the runner context is not available in a job-level env
          XDG_DATA_HOME: ${{ runner.temp }}/xdg/data
          XDG_STATE_HOME: ${{ runner.temp }}/xdg/state
          XDG_CACHE_HOME: ${{ runner.temp }}/xdg/cache
        run: |
          if command -v opencode; then echo "OPENCODE PRESENT — refusing"; exit 1; fi
          echo "opencode ABSENT (guard OK)"
          mkdir -p "$XDG_DATA_HOME" "$XDG_STATE_HOME" "$XDG_CACHE_HOME"
          git rev-parse HEAD
          python -P validation/v23/ci_gate.py --tier rc

  plan:
    if: github.event_name == 'workflow_dispatch' && inputs.tier != 'rc'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: the INVALIDATED and UNRESOLVED targets, with their reasons (F5)
        env:  # step level: the runner context is not available in a job-level env
          XDG_DATA_HOME: ${{ runner.temp }}/xdg/data
          XDG_STATE_HOME: ${{ runner.temp }}/xdg/state
          XDG_CACHE_HOME: ${{ runner.temp }}/xdg/cache
        run: |
          if command -v opencode; then echo "OPENCODE PRESENT — refusing"; exit 1; fi
          echo "opencode ABSENT (guard OK)"
          mkdir -p "$XDG_DATA_HOME" "$XDG_STATE_HOME" "$XDG_CACHE_HOME"
          git rev-parse HEAD
          python -P validation/v23/impact.py --classify --affected
