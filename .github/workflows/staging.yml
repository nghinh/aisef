# Staging — the non-production artifact path (docs/v2/RELEASE-PROCESS.md; V2 charter G8, §10, §18).
#
# Builds the wheel + sdist ONCE, records their sha256, uploads both as workflow artifacts, then installs exactly
# those files into clean venvs on Linux and Windows and runs the CLI smoke from the installed package, never from
# the source tree. This workflow has no publish step and no id-token permission: it cannot publish anything,
# anywhere. release.yml calls it (workflow_call) so the files it publishes are the very files built and smoked here.
#
# Triggers: RC / prerelease tags, pushes to release/** (the V2.0-RC1 staging build of the exact candidate, no tag needed)
# and manual runs. A stable vX.Y.Z tag goes to release.yml instead.
# TestPyPI is not wired (an owner decision: account + trusted publisher, and TestPyPI never accepts a version twice).
#
# BUILD-REPRO-01 (docs/v2.3/W1-DESIGN.md §6; the contract text is docs/v2.3/drafts/BUILD-REPRO-CONTRACT.md, its clauses
# pinned to this file by tests/v23/test_v23_repro_contract.py): `repro` rebuilds the candidate on CPython 3.11-3.14 from
# the fresh checkout and from a perturbed copy, and tag v2.2.0, and checks each against the digests it must give.
name: staging

on:
  push:
    branches: ["release/**"]
    tags: ["v*rc*", "v*-rc*", "v*.dev*"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      # BUILD-REPRO-01: every build records its interpreter, runtime and compiled zlib, frontend and runner image
      - name: record the toolchain
        run: |
          set -eu
          python -P validation/qualification/repro_dist.py --toolchain > "$RUNNER_TEMP/toolchain.json"
          cat "$RUNNER_TEMP/toolchain.json"
      # Reproducible (charter G2, §18): SOURCE_DATE_EPOCH is the commit's time, so a rebuild of the exact RC gives the
      # frozen digests again — the wheel by setuptools itself, the sdist re-packed deterministically (repro_dist.py)
      - name: build the sdist, then the wheel FROM it, reproducibly
        run: |
          set -eu
          export SOURCE_DATE_EPOCH="$(python -P validation/qualification/release_rc.py --epoch)"   # the frozen RC's once frozen
          python -m build
          python -P validation/qualification/repro_dist.py dist/*.tar.gz dist/*.whl
      - run: python -m twine check dist/*
      - name: the wheel and the sdist hold exactly aisef + aisef2
        run: python -P validation/v2/packaging_check.py --artifacts dist
      - name: record the sha256 of the built files
        run: |
          set -eu
          (cd dist && sha256sum -- *) | tee SHA256SUMS
          { echo '### built artifacts (sha256)'; echo '```'; cat SHA256SUMS; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: dist-sha256
          path: SHA256SUMS
          if-no-files-found: error

  install:
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      # The checkout supplies tests/installed_smoke.py and pyproject's version only; -I keeps it off sys.path.
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          name: dist-sha256
          path: .
      - name: the downloaded files are exactly the ones built
        run: cd dist && sha256sum -c ../SHA256SUMS
      - name: install exactly that wheel into a clean venv
        run: |
          set -eu
          tmp="$RUNNER_TEMP"; if command -v cygpath >/dev/null; then tmp=$(cygpath -u "$tmp"); fi
          python -m venv "$tmp/venv"
          py="$tmp/venv/bin/python"; if [ -f "$tmp/venv/Scripts/python.exe" ]; then py="$tmp/venv/Scripts/python.exe"; fi
          "$py" -m pip install --no-index --no-deps dist/*.whl
          echo "SMOKE_PY=$py" >> "$GITHUB_ENV"
          echo "SMOKE_DIR=$tmp" >> "$GITHUB_ENV"
      # --product: the V2 runtime entry `aisef run` dispatches to (aisef2.app.cli.run) must be in the artifact too.
      - name: CLI smoke from the installed artifact
        run: |
          set -eu
          want=$(python -c "import tomllib,pathlib;print(tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version'])")
          smoke="$GITHUB_WORKSPACE/tests/installed_smoke.py"
          cd "$SMOKE_DIR"
          "$SMOKE_PY" -I -c "import aisef2"
          "$SMOKE_PY" -I "$smoke" "$want" --product
      # The public path itself: the installed `aisef run` --check / run / --verify on the offline calc project (fake
      # client, loopback fake provider). The fake client is a script started by its shebang: POSIX runners only.
      - name: product smoke — the installed `aisef run`, end to end and offline
        if: runner.os != 'Windows'
        run: |
          set -eu
          cd "$SMOKE_DIR"
          "$SMOKE_PY" -I "$GITHUB_WORKSPACE/tests/installed_product_smoke.py"
      # CODE-AUDIT #6 (non-A2 part), W1-DESIGN §7 — the historical-2.2 read: a run written by the PUBLISHED 2.2.0 wheel
      # (pip --require-hashes on its frozen sha256, V2.2.0-RC2-FREEZE.json) verifies with this candidate, and its RUN.json
      # carries the 2.2.0 kernel digest. POSIX runners only, like the product smoke.
      - name: historical 2.2 read — a run the published aisef 2.2.0 wrote verifies with the installed candidate
        if: runner.os != 'Windows'
        run: |
          set -eu
          freeze="$GITHUB_WORKSPACE/closure-evidence/v2/release/V2.2.0-RC2-FREEZE.json"
          sha="$(python -c "import json,sys;print(json.load(open(sys.argv[1]))['artifacts']['sha256']['aisef-2.2.0-py3-none-any.whl'])" "$freeze")"
          echo "aisef==2.2.0 --hash=sha256:$sha" > "$SMOKE_DIR/aisef-2.2.0.txt"
          python -m venv "$SMOKE_DIR/v2.2.0"
          "$SMOKE_DIR/v2.2.0/bin/python" -m pip install --no-deps --only-binary=:all: --require-hashes -r "$SMOKE_DIR/aisef-2.2.0.txt"
          cd "$SMOKE_DIR"
          "$SMOKE_PY" -I "$GITHUB_WORKSPACE/tests/installed_product_smoke.py" --writer "$SMOKE_DIR/v2.2.0/bin/aisef"

  # BUILD-REPRO-01 (W1-DESIGN §6): the reproducibility contract's clauses, each run on GitHub-hosted ubuntu-latest:
  # rebuilt on every interpreter it names, from the fresh checkout and from a copy at another path whose files carry
  # non-git permission bits and build debris, both files must equal the 3.12 `build` job's digests; tag v2.2.0 rebuilt
  # with the current repro_dist.py must give its frozen, published digests. A diverging leg is a measurement: fix it,
  # or amend the contract and narrow the matrix explicitly — never drop a leg silently. ~3 runner-minutes per leg.
  repro:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0      # the tag v2.2.0 leg checks the tag out
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install build
      - name: record the toolchain
        run: |
          set -eu
          python -P validation/qualification/repro_dist.py --toolchain > "$RUNNER_TEMP/toolchain.json"
          cat "$RUNNER_TEMP/toolchain.json"
      - uses: actions/download-artifact@v4
        with:
          name: dist-sha256
          path: ${{ runner.temp }}/sums
      - name: the fresh checkout rebuilds the 3.12 build's files
        run: |
          set -eu
          export SOURCE_DATE_EPOCH="$(python -P validation/qualification/release_rc.py --epoch)"
          python -m build
          python -P validation/qualification/repro_dist.py dist/*.tar.gz dist/*.whl
          (cd dist && sha256sum -c "$RUNNER_TEMP/sums/SHA256SUMS")
      - name: a copy at another path, non-git permission bits and build debris, rebuilds them too
        run: |
          set -eu
          export SOURCE_DATE_EPOCH="$(python -P validation/qualification/release_rc.py --epoch)"
          python -P validation/qualification/repro_dist.py --perturb "$GITHUB_WORKSPACE" "$RUNNER_TEMP/perturbed"
          cd "$RUNNER_TEMP/perturbed"
          python -m build
          python -P validation/qualification/repro_dist.py dist/*.tar.gz dist/*.whl
          (cd dist && sha256sum -c "$RUNNER_TEMP/sums/SHA256SUMS")
      - name: tag v2.2.0 rebuilt with the current repro_dist.py gives the published 2.2.0 files
        run: |
          set -eu
          freeze="$GITHUB_WORKSPACE/closure-evidence/v2/release/V2.2.0-RC2-FREEZE.json"
          export SOURCE_DATE_EPOCH="$(python -c "import json,sys;print(json.load(open(sys.argv[1]))['rc']['source_date_epoch'])" "$freeze")"
          python -c "import json,sys;[print(v+'  '+k) for k,v in json.load(open(sys.argv[1]))['artifacts']['sha256'].items()]" "$freeze" > "$RUNNER_TEMP/v220.sums"
          repro="$GITHUB_WORKSPACE/validation/qualification/repro_dist.py"
          git worktree add --detach "$RUNNER_TEMP/v2.2.0" v2.2.0
          cd "$RUNNER_TEMP/v2.2.0"
          python -m build
          python -P "$repro" dist/*.tar.gz dist/*.whl
          (cd dist && sha256sum -c "$RUNNER_TEMP/v220.sums")
